name: Python application CI

on:
  push:
    branches: [ gcp-configuration ]
  pull_request:
    branches: [ gcp-configuration ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      PEPPER_SECRET: ${{ secrets.PEPPER_SECRET }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
      STAFF_USERNAME: ${{ secrets.STAFF_USERNAME }}
      SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
      DB_PATH: totp_secrets.db
      TEMPLATES_DIR: templates
      ORDERS_BOOK_FILE: data/orders_book.json
      ORDERS_FOOD_FILE: data/orders_food.json
      FOOD_MENU_PATH: data/food_menu.json
      BOOK_MENU_PATH: data/book_menu.json
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      GOOGLE_CLIENT_SECRET_FILE: client_secret.json
      GOOGLE_TOKEN_FILE: token.json

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Write Google client secret file
      run: echo "$GOOGLE_CLIENT_SECRET_JSON" > client_secret.json
      env:
        GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}

    - name: Write Google token file
      run: echo "$GOOGLE_TOKEN_JSON" > token.json
      env:
        GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 .

    - name: Install test dependencies
      run: |
        pip install pytest pytest-asyncio
    
    - name: Run tests
      run: |
        echo "Skipping tests"
        # pytest

    - name: Install Azure CLI
      run: |
        curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

    - name: Upload static files to Azure Blob Storage
      run: |
        az storage blob upload-batch \
          --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
          --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
          --source static \
          --destination '$web'
